# 放入 80 default server 块，防止通过 HTTP 直接读取静态游戏文件
location = /scratch {
    return 301 https://101-132-125-38.sslip.io/scratch/;
}

location ^~ /scratch/ {
    return 301 https://101-132-125-38.sslip.io/scratch/;
}

location = /auth {
    return 301 https://101-132-125-38.sslip.io/auth/login;
}

location ^~ /auth/ {
    return 301 https://101-132-125-38.sslip.io$request_uri;
}
